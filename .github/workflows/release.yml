name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: rivet-release
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: RustSec audit
        uses: actions-rust-lang/audit@v1
        with:
          denyWarnings: true
          createIssues: false

  windows:
    needs: audit
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value
          if ($env:RELEASE_TAG -cne "v$version" -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Tag must match the stable Cargo version.' }
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Native data-safety regressions
        run: cargo test --locked platform::win32::safety_tests -- --ignored --test-threads=1
      - name: Native editing and dialog regressions
        run: cargo test --locked platform::win32::pr_integration_tests -- --ignored --test-threads=1
      - name: Optimized accelerator regression
        run: cargo test --release --locked accelerator_table_with_f5_can_be_created_repeatedly
      - name: Legacy uninstall preserves notes
        run: pwsh -File scripts/test-legacy-uninstall.ps1
      - name: Build portable
        run: pwsh -ExecutionPolicy Bypass -File scripts\package.ps1
      - name: Build installer
        run: pwsh -ExecutionPolicy Bypass -File scripts\build-installer.ps1
      - name: Test silent installer
        run: pwsh -File scripts/test-updater-installer.ps1
      - name: Test system-wide installer
        run: pwsh -File scripts/test-updater-installer.ps1 -Scope Machine
      - name: Sign update metadata
        env:
          RIVET_UPDATE_SIGNING_KEY: ${{ secrets.RIVET_UPDATE_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: pwsh -File scripts/prepare-update.ps1 -Tag $env:RELEASE_TAG
      - name: Prepare release notes
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag.TrimStart("v")
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -SimpleMatch "## [$version]" -List).LineNumber
          if (-not $start) { throw "Release section [$version] not found in CHANGELOG.md." }
          $next = ($lines | Select-String -SimpleMatch "## [" | Where-Object { $_.LineNumber -gt $start } | Select-Object -First 1).LineNumber
          if ($next) {
            $section = $lines[($start - 1)..($next - 2)]
          } else {
            $section = $lines[($start - 1)..($lines.Length - 1)]
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $section | Set-Content -Path dist\\release-notes.md -Encoding utf8
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: pwsh -File scripts/publish-release.ps1 -Tag $env:RELEASE_TAG
