name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"

jobs:
  check-format:
    name: cargo fmt --check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Format
        run: cargo fmt --check

  clippy:
    name: cargo clippy --all-targets -- -D warnings
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: cargo test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Test
        run: cargo test --locked
      - name: Native data-safety regressions
        run: cargo test --locked platform::win32::safety_tests -- --ignored --test-threads=1
      - name: Legacy uninstall preserves notes
        run: pwsh -File scripts/test-legacy-uninstall.ps1

  audit:
    name: RustSec audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: RustSec audit
        uses: actions-rust-lang/audit@v1
        with:
          denyWarnings: true
          createIssues: false
